<!doctype html>
<!--
  alpha.41 broadcast multiview — 4 channels in one window. Each tile
  is a full source→DeckLink-output pipeline routed via the same
  /api/i/:idx/* endpoints the single-source UI uses; TILE_COUNT=4 in
  fleet.rs gives us 4 independent EncoderState + Streamer + Preview
  slots.

  alpha.41 production hardening:
  - System health pill in header (CPU/RAM polled every 2s via
    /api/system-health, traffic-light Green/Yellow/Red).
  - Confirm dialog on Stop / Stop All when tile is Streaming —
    prevents stray-click off-air during a live show.
  - Source / DeckLink output / Mode dropdowns disabled while a tile
    is Streaming, so config can't silently drift from the live state.
  - Per-tile state persisted to disk via /api/i/N/settings → reloads
    on restart so a crash / Cmd-Q / installer doesn't wipe configs.
  - Backend stall detector: FFmpeg "Streaming with fps=0 for 5s"
    triggers a force-kill that the alpha.30 supervisor catches and
    reconnects — operator sees "Reconnecting" rather than a stuck-
    Streaming-forever tile.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ATEM IP Patchbay · Multiview</title>
<style>
  :root {
    --bg: #0e0f12;
    --bg-tile: #15171c;
    --bg-input: #1c1e24;
    --bg-preview: #050608;
    --border: #2a2e36;
    --border-active: #3a4250;
    --text: #e6e6ea;
    --text-dim: #8a8f9b;
    --accent: #66d3fa;
    --accent-hot: #99e3ff;
    --good: #5fd06b;
    --warn: #f0b84f;
    --bad: #e85c5c;
    --idle: #6f7682;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    min-height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    height: 42px;
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
  }
  header h1 .sub {
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 8px;
    font-size: 11px;
  }
  header .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  header a, header button {
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 11px;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
  }
  header a:hover, header button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  header button.danger {
    border-color: rgba(232,92,92,0.5);
    color: var(--bad);
  }
  header button.danger:hover {
    border-color: var(--bad);
    background: rgba(232,92,92,0.15);
  }

  /* alpha.41 system health pill — polled from /api/system-health
     every 2s. Tooltip on hover shows CPU/RAM detail. */
  .sys-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    font-size: 11px;
    font-weight: 600;
    cursor: default;
    user-select: none;
    line-height: 1;
  }
  .sys-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--idle);
    flex-shrink: 0;
  }
  .sys-pill.green { border-color: rgba(95,208,107,0.5); color: var(--good); }
  .sys-pill.green .dot { background: var(--good); box-shadow: 0 0 6px rgba(95,208,107,0.6); }
  .sys-pill.yellow { border-color: rgba(240,184,79,0.55); color: var(--warn); }
  .sys-pill.yellow .dot { background: var(--warn); box-shadow: 0 0 6px rgba(240,184,79,0.6); }
  .sys-pill.red { border-color: rgba(232,92,92,0.7); color: var(--bad); background: rgba(232,92,92,0.06); }
  .sys-pill.red .dot { background: var(--bad); box-shadow: 0 0 8px rgba(232,92,92,0.8); }
  .sys-pill.unknown { color: var(--text-dim); }
  .sys-pill .label-text {
    font-variant-numeric: tabular-nums;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    padding: 8px;
    height: calc(100vh - 43px);
  }
  /* Below 800px width, stack vertically so the controls still fit. */
  @media (max-width: 800px) {
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(4, 1fr);
    }
  }

  .tile {
    background: var(--bg-tile);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .tile.streaming { border-color: var(--good); }
  .tile.reconnecting { border-color: var(--warn); }
  .tile.interrupted { border-color: var(--bad); }
  .tile.connecting { border-color: var(--accent); }

  .tile-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid var(--border);
    min-height: 28px;
    font-size: 11px;
  }
  .tile-idx {
    font-weight: 700;
    color: var(--accent);
    width: 14px;
  }
  .tile-name {
    flex: 1;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-dim);
  }
  .pill {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 2px 6px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .pill.idle { background: rgba(111,118,130,0.2); color: var(--idle); }
  .pill.connecting { background: rgba(102,211,250,0.15); color: var(--accent); }
  .pill.streaming { background: rgba(95,208,107,0.15); color: var(--good); }
  .pill.reconnecting { background: rgba(240,184,79,0.15); color: var(--warn); }
  .pill.interrupted { background: rgba(232,92,92,0.15); color: var(--bad); }

  .preview {
    position: relative;
    background: var(--bg-preview);
    aspect-ratio: 16/9;
    flex-shrink: 0;
    overflow: hidden;
  }
  .preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .preview-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 10px;
    font-style: italic;
  }
  .preview-overlay {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 3px 6px;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    font-size: 9px;
    color: rgba(255,255,255,0.85);
    display: flex;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
  }
  .preview-overlay .err {
    color: var(--bad);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .control-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .control-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  select, .control-row input[type=text] {
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 5px;
    font-size: 11px;
    font-family: inherit;
    width: 100%;
  }
  select option {
    background: #0e0f12;
    color: #e6e6ea;
  }
  select:focus, .control-row input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .row-actions {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .row-actions button {
    flex: 1;
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .row-actions button.primary {
    border-color: var(--good);
    color: var(--good);
  }
  .row-actions button.primary:hover {
    background: rgba(95,208,107,0.12);
  }
  .row-actions button.danger {
    border-color: var(--bad);
    color: var(--bad);
  }
  .row-actions button.danger:hover {
    background: rgba(232,92,92,0.12);
  }
  .row-actions button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .tile-foot {
    padding: 4px 8px;
    background: rgba(0,0,0,0.2);
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    gap: 6px;
    min-height: 22px;
    align-items: center;
  }

  /* Toast for error/info */
  #toast {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: #1c1e24;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    max-width: 360px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 180ms, transform 180ms;
    z-index: 50;
  }
  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  #toast.bad { border-color: var(--bad); color: var(--bad); }
  #toast.good { border-color: var(--good); color: var(--good); }
</style>
</head>
<body>

<header>
  <h1>Multiview <span class="sub">4 channels · NDI/OMT → DeckLink</span></h1>
  <div class="controls">
    <div id="sys-pill" class="sys-pill unknown" title="System health — CPU + memory">
      <span class="dot"></span>
      <span class="label-text" id="sys-pill-label">starting…</span>
    </div>
    <a href="/">← Single-source</a>
    <button id="refresh-all" type="button" title="Refresh discovery + tile state">↻ Refresh</button>
    <button id="stop-all" type="button" class="danger" title="Stop every tile that's streaming">Stop All</button>
  </div>
</header>

<div id="grid" class="grid"></div>

<div id="toast"></div>

<script>
"use strict";

const TILE_COUNT = 4;
const TILES = Array.from({ length: TILE_COUNT }, (_, i) => i);
const POLL_INTERVAL_MS = 1000;
const PREVIEW_INTERVAL_MS = 500;
const SYS_HEALTH_INTERVAL_MS = 2000;

// alpha.41: status taxonomy that should be confirmed before
// destructive actions. "Reconnecting" not in this set because
// reconnecting is already "off-air" (operator stopping it just
// makes it permanent, no surprise content disappears).
const STREAMING_STATUSES = new Set(['streaming', 'connecting']);

// Per-tile in-memory state cache. Populated lazily on first state poll.
const tileState = {};
const tilePreviewCounter = {};

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return Array.from(document.querySelectorAll(sel)); }

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (k === 'dataset') {
        for (const [dk, dv] of Object.entries(v)) node.dataset[dk] = dv;
      }
      else if (v === false || v === null || v === undefined) {}
      else node.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c === null || c === undefined || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') node.appendChild(document.createTextNode(String(c)));
    else node.appendChild(c);
  }
  return node;
}

let toastTimer = null;
function toast(message, kind) {
  const t = $('#toast');
  t.textContent = message;
  t.className = (kind === 'bad' || kind === 'good') ? kind + ' show' : 'show';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 4000);
}

async function fetchJson(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`${res.status} ${url}${body ? ': ' + body.slice(0, 200) : ''}`);
  }
  return res.json();
}

function buildTile(idx) {
  const tile = el('div', { class: 'tile', id: `tile-${idx}`, dataset: { idx: String(idx) } },
    el('div', { class: 'tile-head' },
      el('span', { class: 'tile-idx' }, idx + 1),
      el('span', { class: 'tile-name', id: `tile-name-${idx}` }, 'Idle'),
      el('span', { class: 'pill idle', id: `tile-pill-${idx}` }, 'Idle')
    ),
    el('div', { class: 'preview', id: `tile-preview-${idx}` },
      el('div', { class: 'preview-placeholder' }, 'no signal'),
      el('div', { class: 'preview-overlay' },
        el('span', { id: `tile-info-${idx}` }, ''),
        el('span', { id: `tile-err-${idx}`, class: 'err' }, '')
      )
    ),
    el('div', { class: 'controls' },
      el('div', { class: 'control-row' },
        el('label', { class: 'control-label', for: `tile-src-${idx}` }, 'Source'),
        el('select', { id: `tile-src-${idx}`, onchange: (e) => onSourceChange(idx, e.target.value) },
          el('option', { value: '__none__' }, '— pick source —')
        )
      ),
      el('div', { class: 'control-row' },
        el('label', { class: 'control-label', for: `tile-dl-${idx}` }, 'DeckLink output'),
        el('select', { id: `tile-dl-${idx}`, onchange: (e) => onDecklinkChange(idx, e.target.value) },
          el('option', { value: '__none__' }, '— pick output —')
        )
      ),
      el('div', { class: 'control-row' },
        el('label', { class: 'control-label', for: `tile-mode-${idx}` }, 'Output mode'),
        el('select', { id: `tile-mode-${idx}`, onchange: (e) => onModeChange(idx, e.target.value), disabled: true },
          el('option', { value: '__none__' }, '— pick output first —')
        )
      ),
      el('div', { class: 'control-row' },
        el('label', { class: 'control-label', for: `tile-audio-${idx}` }, 'Audio'),
        el('select', { id: `tile-audio-${idx}`, onchange: (e) => onAudioChange(idx, e.target.value) },
          el('option', { value: 'auto' }, 'Auto (from source)'),
          el('option', { value: 'silent' }, 'Silent')
        )
      ),
      el('div', { class: 'row-actions' },
        el('button', { class: 'primary', id: `tile-start-${idx}`, onclick: () => onStart(idx) }, '▶ Start'),
        el('button', { class: 'danger', id: `tile-stop-${idx}`, onclick: () => onStop(idx) }, '◼ Stop')
      )
    ),
    el('div', { class: 'tile-foot' },
      el('span', { id: `tile-foot-src-${idx}` }, ''),
      el('span', { id: `tile-foot-dest-${idx}` }, '')
    )
  );
  return tile;
}

// -------------------------------------------------------------------
// Loading + populating dropdowns
// -------------------------------------------------------------------

async function loadNdiSenders() {
  try {
    // /api/i/0/ndi-senders proxies the global discovery, so any tile's
    // endpoint returns the same list.
    const data = await fetchJson('/api/i/0/ndi-senders');
    return data.senders || [];
  } catch (e) {
    console.warn('NDI senders load failed:', e);
    return [];
  }
}

async function loadOmtSenders() {
  try {
    const data = await fetchJson('/api/i/0/omt-senders');
    return data.senders || [];
  } catch (e) {
    console.warn('OMT senders load failed:', e);
    return [];
  }
}

async function loadDecklinkOutputs() {
  try {
    const data = await fetchJson('/api/i/0/decklink-outputs');
    // The endpoint returns the Vec<DecklinkDeviceWithModes> directly,
    // not wrapped. Normalize to { devices: [...] } so the rest of this
    // file can keep one shape.
    return { devices: Array.isArray(data) ? data : (data.devices || []) };
  } catch (e) {
    console.warn('DeckLink outputs load failed:', e);
    return { devices: [] };
  }
}

let knownDecklink = { devices: [] };
let knownNdi = [];
let knownOmt = [];

function populateSourceDropdown(idx) {
  const sel = document.getElementById(`tile-src-${idx}`);
  if (!sel) return;
  const current = tileState[idx]?.snapshot?.source_id;
  const currentNdi = tileState[idx]?.snapshot?.ndi_source_name;
  const currentOmt = tileState[idx]?.snapshot?.omt_source_name;

  sel.innerHTML = '';
  sel.appendChild(el('option', { value: '__none__' }, '— pick source —'));

  if (knownNdi.length) {
    const grp = el('optgroup', { label: 'NDI' });
    for (const s of knownNdi) {
      const val = 'ndi:' + s.name;
      const opt = el('option', { value: val }, s.name);
      if (current === 'ndi' && currentNdi === s.name) opt.selected = true;
      grp.appendChild(opt);
    }
    sel.appendChild(grp);
  }
  if (knownOmt.length) {
    const grp = el('optgroup', { label: 'OMT' });
    for (const s of knownOmt) {
      const val = 'omt:' + s.name;
      const opt = el('option', { value: val }, s.name);
      if (current === 'omt' && currentOmt === s.name) opt.selected = true;
      grp.appendChild(opt);
    }
    sel.appendChild(grp);
  }
  // Always offer the test pattern as a safe fallback for verifying
  // that 8x decklink_enc concurrency actually works on the rig.
  const tp = el('option', { value: 'test_pattern' }, 'Test pattern (SMPTE bars)');
  if (current === 'test_pattern') tp.selected = true;
  sel.appendChild(tp);
}

function populateDecklinkDropdown(idx) {
  const sel = document.getElementById(`tile-dl-${idx}`);
  if (!sel) return;
  const current = tileState[idx]?.snapshot?.decklink_device_name;
  sel.innerHTML = '';
  sel.appendChild(el('option', { value: '__none__' }, '— pick output —'));
  const devices = knownDecklink.devices || [];
  for (const d of devices) {
    const opt = el('option', { value: d.name }, d.name);
    if (current === d.name) opt.selected = true;
    sel.appendChild(opt);
  }
  // Once a device is picked, also populate the mode dropdown.
  if (current) populateModeDropdown(idx, current);
}

function populateModeDropdown(idx, deviceName) {
  const sel = document.getElementById(`tile-mode-${idx}`);
  if (!sel) return;
  const device = (knownDecklink.devices || []).find(d => d.name === deviceName);
  sel.innerHTML = '';
  if (!device || !device.modes || !device.modes.length) {
    sel.appendChild(el('option', { value: '__none__' }, '— no modes —'));
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.appendChild(el('option', { value: '__none__' }, '— pick mode —'));
  const currentCode = tileState[idx]?.snapshot?.decklink_format_code;
  for (const m of device.modes) {
    const label = `${m.width}x${m.height} ${(m.fps_num/(m.fps_den||1)).toFixed(2)} (${m.format_code})`;
    const opt = el('option', { value: m.format_code }, label);
    if (currentCode === m.format_code) opt.selected = true;
    sel.appendChild(opt);
  }
}

function setAudioDropdown(idx) {
  const sel = document.getElementById(`tile-audio-${idx}`);
  if (!sel) return;
  const cur = tileState[idx]?.snapshot?.audio_mode || 'auto';
  for (const opt of sel.options) opt.selected = (opt.value === cur);
}

// -------------------------------------------------------------------
// Setting changes
// -------------------------------------------------------------------

async function applySettings(idx, payload) {
  try {
    await fetchJson(`/api/i/${idx}/settings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    toast(`Tile ${idx + 1} settings: ${e.message}`, 'bad');
    throw e;
  }
}

async function onSourceChange(idx, value) {
  if (value === '__none__') return;
  if (value.startsWith('ndi:')) {
    await applySettings(idx, { source_id: 'ndi', ndi_source_name: value.slice(4) });
  } else if (value.startsWith('omt:')) {
    await applySettings(idx, { source_id: 'omt', omt_source_name: value.slice(4) });
  } else if (value === 'test_pattern') {
    await applySettings(idx, { source_id: 'test_pattern' });
  }
}

async function onDecklinkChange(idx, deviceName) {
  if (deviceName === '__none__') return;
  await applySettings(idx, {
    destination_type: 'decklink',
    decklink_device_name: deviceName
  });
  populateModeDropdown(idx, deviceName);
}

async function onModeChange(idx, formatCode) {
  if (formatCode === '__none__') return;
  // Find the human-readable mode label for decklink_output_mode.
  const dl = tileState[idx]?.snapshot?.decklink_device_name;
  const device = (knownDecklink.devices || []).find(d => d.name === dl);
  const mode = device?.modes?.find(m => m.format_code === formatCode);
  const modeLabel = mode ? `${mode.width}p${(mode.fps_num/(mode.fps_den||1)).toFixed(0)}` : formatCode;
  await applySettings(idx, {
    destination_type: 'decklink',
    decklink_format_code: formatCode,
    decklink_output_mode: modeLabel
  });
}

async function onAudioChange(idx, mode) {
  await applySettings(idx, { audio_mode: mode });
}

async function onStart(idx) {
  try {
    await fetchJson(`/api/i/${idx}/start`, { method: 'POST' });
    toast(`Tile ${idx + 1}: starting…`, 'good');
  } catch (e) {
    toast(`Tile ${idx + 1} start: ${e.message}`, 'bad');
  }
}

async function onStop(idx) {
  // alpha.41 destructive-op guard: when the tile is in Streaming
  // (or Connecting), a stray click takes a real output off-air. Pop
  // a synchronous confirm() with the current bitrate + destination
  // so the operator sees what they're about to interrupt. Skipped
  // for Idle / Interrupted / Reconnecting tiles where there's no
  // live content to lose.
  const snap = tileState[idx]?.snapshot;
  const status = (snap?.stats?.status || '').toLowerCase();
  if (STREAMING_STATUSES.has(status)) {
    const bitrate = snap?.stats?.bitrate || 0;
    const fps = snap?.stats?.fps || 0;
    const dest = describeDest(snap);
    const msg = `Stop tile ${idx + 1}?\n\n` +
      `Currently ${status === 'streaming' ? 'streaming' : 'connecting'}: ` +
      `${(bitrate / 1000).toFixed(1)} Mbps · ${fps.toFixed(1)} fps\n` +
      `→ ${dest}`;
    if (!confirm(msg)) return;
  }
  try {
    await fetchJson(`/api/i/${idx}/stop`, { method: 'POST' });
    toast(`Tile ${idx + 1}: stopping`, 'good');
  } catch (e) {
    toast(`Tile ${idx + 1} stop: ${e.message}`, 'bad');
  }
}

async function onStopAll() {
  // Find the streaming tiles up front so we can include the count
  // in the confirm prompt. "Reconnecting" tiles count too — they're
  // a stream the operator intends to recover, stopping them gives
  // up the recovery.
  const active = TILES.filter(idx => {
    const status = (tileState[idx]?.snapshot?.stats?.status || '').toLowerCase();
    return status === 'streaming' || status === 'connecting' || status === 'reconnecting';
  });
  if (active.length === 0) {
    toast('No active tiles to stop', 'good');
    return;
  }
  if (!confirm(`Stop ALL ${active.length} active tile${active.length === 1 ? '' : 's'}?\n\nThis takes every running output off-air.`)) {
    return;
  }
  for (const idx of active) {
    try { await fetch(`/api/i/${idx}/stop`, { method: 'POST' }); } catch {}
  }
  toast(`Stopped ${active.length} tile${active.length === 1 ? '' : 's'}`, 'good');
}

// -------------------------------------------------------------------
// alpha.41 system health polling
// -------------------------------------------------------------------

async function pollSystemHealth() {
  try {
    const data = await fetchJson('/api/system-health');
    renderSystemHealth(data);
  } catch (e) {
    const pill = document.getElementById('sys-pill');
    const lbl = document.getElementById('sys-pill-label');
    if (pill && lbl) {
      pill.className = 'sys-pill unknown';
      lbl.textContent = 'monitor offline';
      pill.title = 'Cannot reach /api/system-health';
    }
  }
}

function renderSystemHealth(data) {
  const pill = document.getElementById('sys-pill');
  const lbl = document.getElementById('sys-pill-label');
  if (!pill || !lbl) return;
  const status = data.status || 'unknown';
  pill.className = 'sys-pill ' + status;
  const cpu = Math.round(data.cpu_percent || 0);
  const memUsed = data.mem_used_mb || 0;
  const memTotal = data.mem_total_mb || 0;
  const memPct = Math.round(data.mem_percent || 0);

  let summary;
  if (status === 'unknown') {
    summary = 'starting…';
  } else if (status === 'red') {
    summary = (data.warning || `CPU ${cpu}% · MEM ${memPct}%`).split('—')[0].trim();
  } else {
    summary = `CPU ${cpu}% · MEM ${memPct}%`;
  }
  lbl.textContent = summary;

  const tooltipParts = [
    `Status: ${status.toUpperCase()}`,
    `CPU: ${cpu}% (${data.cpu_count || '?'} cores)`,
    `Memory: ${memPct}% — ${(memUsed / 1024).toFixed(1)} / ${(memTotal / 1024).toFixed(1)} GB`,
  ];
  if (data.warning) tooltipParts.push('', data.warning);
  pill.title = tooltipParts.join('\n');
}

// -------------------------------------------------------------------
// State polling
// -------------------------------------------------------------------

function statusToClass(status) {
  switch ((status || '').toLowerCase()) {
    case 'streaming': return 'streaming';
    case 'connecting': return 'connecting';
    case 'reconnecting': return 'reconnecting';
    case 'interrupted': return 'interrupted';
    case 'preview': return 'connecting';
    default: return 'idle';
  }
}

function statusPillText(snap) {
  const s = snap?.stats?.status || 'Idle';
  if (s.toLowerCase() === 'reconnecting') {
    const next = snap.stats?.reconnect_next_secs || 0;
    const att = snap.stats?.reconnect_attempt || 0;
    const max = snap?.auto_reconnect_max_attempts || 12;
    return `Reconnect ${next}s · ${att}/${max}`;
  }
  return s;
}

function describeSource(snap) {
  switch (snap.source_id) {
    case 'ndi': return snap.ndi_source_name ? `NDI · ${snap.ndi_source_name}` : 'NDI (no source)';
    case 'omt': return snap.omt_source_name ? `OMT · ${snap.omt_source_name}` : 'OMT (no source)';
    case 'test_pattern': return 'Test pattern';
    case 'avfoundation': return snap.av_video_name ? `Camera · ${snap.av_video_name}` : 'Camera';
    case 'screen_capture': return 'Screen';
    case 'pipe': return snap.pipe_path ? `Pipe · ${snap.pipe_path}` : 'Pipe';
    case 'srt_listen': return 'SRT receiver';
    case 'rtmp_listen': return 'RTMP receiver';
    default: return snap.source_id || '—';
  }
}

function describeDest(snap) {
  if (snap.destination_type === 'decklink') {
    const dev = snap.decklink_device_name || '(no device)';
    const mode = snap.decklink_output_mode || snap.decklink_format_code || '';
    return mode ? `${dev} · ${mode}` : dev;
  }
  return 'ATEM/SRT (set DeckLink to route here)';
}

function renderTile(idx, data) {
  const snap = data.snapshot || data;
  const tile = document.getElementById(`tile-${idx}`);
  if (!tile) return;
  const klass = statusToClass(snap?.stats?.status);
  tile.className = 'tile' + (klass ? ' ' + klass : '');

  const name = document.getElementById(`tile-name-${idx}`);
  name.textContent = snap?.decklink_device_name || snap?.label || `Tile ${idx + 1}`;

  const pill = document.getElementById(`tile-pill-${idx}`);
  pill.className = 'pill ' + klass;
  pill.textContent = statusPillText(snap);

  const info = document.getElementById(`tile-info-${idx}`);
  const bitrate = snap?.stats?.bitrate || 0;
  const fps = snap?.stats?.fps || 0;
  if (klass === 'streaming') {
    info.textContent = `${(bitrate / 1000).toFixed(1)} Mbps · ${fps.toFixed(1)} fps`;
  } else if (klass === 'connecting') {
    info.textContent = 'connecting…';
  } else if (klass === 'reconnecting') {
    info.textContent = `attempt ${snap.stats.reconnect_attempt}/${snap?.auto_reconnect_max_attempts || 12}`;
  } else {
    info.textContent = '';
  }

  const errEl = document.getElementById(`tile-err-${idx}`);
  errEl.textContent = snap?.stats?.error ? String(snap.stats.error).slice(0, 80) : '';

  document.getElementById(`tile-foot-src-${idx}`).textContent = describeSource(snap);
  document.getElementById(`tile-foot-dest-${idx}`).textContent = describeDest(snap);

  // Reflect server state in the dropdowns whenever it changes (e.g.
  // operator made changes in another window or via the single-source UI).
  setAudioDropdown(idx);

  // alpha.41 destructive-op guard: disable configuration dropdowns
  // while the tile is Streaming or Connecting so source/dest/mode
  // changes can't silently drift away from the running stream's
  // actual config. Re-enabled the moment status drops back to
  // Idle / Interrupted / Reconnecting (Reconnecting because at that
  // point the operator should be free to reconfigure during backoff).
  const locked = STREAMING_STATUSES.has((snap?.stats?.status || '').toLowerCase());
  const lockTitle = locked
    ? 'Locked while streaming — Stop the tile to change configuration'
    : '';
  for (const ctrl of [
    `tile-src-${idx}`,
    `tile-dl-${idx}`,
    `tile-mode-${idx}`,
    `tile-audio-${idx}`,
    `tile-start-${idx}`,
  ]) {
    const el = document.getElementById(ctrl);
    if (!el) continue;
    // Skip the mode dropdown if it has no real choices yet (no
    // DeckLink picked) — its own "disabled" reflects that case.
    if (ctrl === `tile-mode-${idx}` && !tileState[idx]?.snapshot?.decklink_device_name) {
      continue;
    }
    if (ctrl === `tile-start-${idx}`) {
      // Start should only be disabled while ACTIVELY streaming —
      // Connecting allowed because clicking Start during Connecting
      // does nothing anyway. Stop is always enabled (it's the
      // escape hatch).
      el.disabled = (snap?.stats?.status || '').toLowerCase() === 'streaming';
    } else {
      el.disabled = locked;
    }
    if (locked) el.title = lockTitle;
    else el.removeAttribute('title');
  }
}

async function pollTile(idx) {
  try {
    const data = await fetchJson(`/api/i/${idx}/state`);
    const wasFirst = !tileState[idx];
    tileState[idx] = data;
    if (wasFirst) {
      populateSourceDropdown(idx);
      populateDecklinkDropdown(idx);
    }
    renderTile(idx, data);
  } catch (e) {
    console.warn(`tile ${idx} state poll failed:`, e);
  }
}

async function pollAllTiles() {
  await Promise.all(TILES.map(pollTile));
}

// Preview poll — refresh JPEG every PREVIEW_INTERVAL_MS by bumping a
// cache-buster query param. We only refresh tiles whose status is
// streaming or preview to save bandwidth on idle tiles.
function refreshPreviews() {
  for (const idx of TILES) {
    const snap = tileState[idx]?.snapshot;
    const status = (snap?.stats?.status || '').toLowerCase();
    const previewState = (tileState[idx]?.preview?.state || '').toLowerCase();
    const shouldShow = status === 'streaming' || previewState === 'running';
    const container = document.getElementById(`tile-preview-${idx}`);
    if (!container) continue;
    const existing = container.querySelector('img');
    const placeholder = container.querySelector('.preview-placeholder');
    if (shouldShow) {
      tilePreviewCounter[idx] = (tilePreviewCounter[idx] || 0) + 1;
      const src = `/api/i/${idx}/preview?t=${tilePreviewCounter[idx]}`;
      if (existing) {
        existing.src = src;
      } else {
        const img = el('img', { alt: '', onerror: () => { img.remove(); if (placeholder) placeholder.style.display = ''; } });
        img.onload = () => { if (placeholder) placeholder.style.display = 'none'; };
        img.src = src;
        container.insertBefore(img, container.firstChild);
      }
    } else {
      if (existing) existing.remove();
      if (placeholder) placeholder.style.display = '';
    }
  }
}

// -------------------------------------------------------------------
// Bootstrap
// -------------------------------------------------------------------

async function bootstrap() {
  const grid = $('#grid');
  for (const idx of TILES) grid.appendChild(buildTile(idx));

  $('#refresh-all').addEventListener('click', async () => {
    toast('Refreshing…', 'good');
    knownDecklink = await loadDecklinkOutputs();
    knownNdi = await loadNdiSenders();
    knownOmt = await loadOmtSenders();
    for (const idx of TILES) {
      populateSourceDropdown(idx);
      populateDecklinkDropdown(idx);
    }
    await pollAllTiles();
  });
  $('#stop-all').addEventListener('click', onStopAll);

  knownDecklink = await loadDecklinkOutputs();
  knownNdi = await loadNdiSenders();
  knownOmt = await loadOmtSenders();
  await pollAllTiles();
  for (const idx of TILES) {
    populateSourceDropdown(idx);
    populateDecklinkDropdown(idx);
  }

  // alpha.41: kick off system health polling alongside tile state.
  // Fire one immediate poll so the pill doesn't sit on "starting…"
  // for the full interval before the first real reading.
  pollSystemHealth();
  setInterval(pollSystemHealth, SYS_HEALTH_INTERVAL_MS);

  setInterval(pollAllTiles, POLL_INTERVAL_MS);
  setInterval(refreshPreviews, PREVIEW_INTERVAL_MS);
  refreshPreviews();
}

window.addEventListener('DOMContentLoaded', bootstrap);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATEM IP Patchbay · Multi-View</title>
  <link rel="stylesheet" href="/static/multiview.css">
</head>
<body>
  <!-- Topbar shared across all 4 tiles. The per-tile UI inside each
       iframe also has its own topbar (Refresh, Net Diag, etc.); this
       outer one is for FLEET-level controls: layout toggle (grid ↔
       single tile 0 fullscreen) and spawning an additional process
       via the existing --instance-name CLI flag (Phase A of the
       multi-source rollout). -->
  <header class="mv-topbar">
    <div class="mv-brand">ATEM IP Patchbay · Multi-View</div>
    <div class="mv-tiles-status" id="mv-tiles-status">4 tiles idle</div>
    <div class="mv-actions">
      <button id="mv-layout-toggle" class="mv-btn" type="button">Single View</button>
      <button id="mv-spawn" class="mv-btn mv-btn-secondary" type="button"
              title="Open another patchbay window with its own state + ports">+ New Window</button>
    </div>
  </header>

  <main class="mv-grid" id="mv-grid">
    <!-- Each tile is an iframe loading the existing single-source UI
         with ?tile=N appended. app.js's fetch shim picks up that
         query param and rewrites every /api/* call to /api/i/N/* so
         each iframe's API calls land on the right tile in the
         backend EncoderFleet. -->
    <section class="mv-tile" data-tile="0">
      <div class="mv-tile-chrome">
        <span class="mv-tile-label">Tile 1</span>
        <span class="mv-tile-status" id="mv-status-0">Idle</span>
      </div>
      <iframe class="mv-tile-frame" src="/static/index.html?tile=0" title="Tile 1" loading="eager"></iframe>
    </section>
    <section class="mv-tile" data-tile="1">
      <div class="mv-tile-chrome">
        <span class="mv-tile-label">Tile 2</span>
        <span class="mv-tile-status" id="mv-status-1">Idle</span>
      </div>
      <iframe class="mv-tile-frame" src="/static/index.html?tile=1" title="Tile 2" loading="lazy"></iframe>
    </section>
    <section class="mv-tile" data-tile="2">
      <div class="mv-tile-chrome">
        <span class="mv-tile-label">Tile 3</span>
        <span class="mv-tile-status" id="mv-status-2">Idle</span>
      </div>
      <iframe class="mv-tile-frame" src="/static/index.html?tile=2" title="Tile 3" loading="lazy"></iframe>
    </section>
    <section class="mv-tile" data-tile="3">
      <div class="mv-tile-chrome">
        <span class="mv-tile-label">Tile 4</span>
        <span class="mv-tile-status" id="mv-status-3">Idle</span>
      </div>
      <iframe class="mv-tile-frame" src="/static/index.html?tile=3" title="Tile 4" loading="lazy"></iframe>
    </section>
  </main>

  <script src="/static/multiview.js"></script>
</body>
</html>
